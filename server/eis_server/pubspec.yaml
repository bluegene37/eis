name: eis_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  # sdk: '^3.8.0'
  # Gene - Nov, 20, 2026: Updated SDK constraint and Serverpod packages to 4.1.2 to match installed Serverpod 4.1.2 CLI.
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  # serverpod: 3.4.8
  # Gene - Nov, 20, 2026: Upgraded Serverpod dependency from 3.4.8 to 4.1.2.
  serverpod: 4.1.2
  # Gene - Nov, 17, 2026: Added pure-Dart cryptography (RSA JWS RS256, AES-256-GCM, SHA-256) and HTTP client dependencies for BIR EIS v2.01.
  crypto: ^3.0.2
  http: ^1.6.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  # serverpod_test: 3.4.8
  # Gene - Nov, 20, 2026: Upgraded serverpod_test from 3.4.8 to 4.1.2.
  serverpod_test: 4.1.2
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # Gene - Nov, 20, 2026: Point flutter_build to root Flutter app (../..) in nested server/eis_server layout.
    # flutter_build:
    #   windows: >-
    #     (if exist web\app rmdir /S /Q web\app)
    #     & cd /D ..\eis_flutter
    #     && flutter build web --base-href /app/ --wasm
    #     && xcopy /E /I /Y build\web ..\eis_server\web\app
    #   posix: |
    #     cd ../eis_flutter
    #     flutter build web --base-href /app/ --wasm --output ../eis_server/web/app
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\..
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web server\eis_server\web\app
      posix: |
        cd ../..
        flutter build web --base-href /app/ --wasm --output server/eis_server/web/app
