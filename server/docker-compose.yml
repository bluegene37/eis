services:
  postgres:
    image: postgres:16-alpine
    container_name: ies-postgres
    environment:
      POSTGRES_DB: ies_bir
      POSTGRES_USER: ies_user
      POSTGRES_PASSWORD: ies_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ies_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ies_user -d ies_bir"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ies-redis
    ports:
      - "6379:6379"
    volumes:
      - ies_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ies_pgdata:
  ies_redisdata:
